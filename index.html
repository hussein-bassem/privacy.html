<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:"Cairo",sans-serif;
    min-height:100vh;
    background:linear-gradient(135deg,#ffd6e7,#fff0f6,#f8d9ff);
    overflow:hidden;
    color:#333;
}

.app{
    width:100%;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:min(430px,100%);
    display:grid; /* التعديل هنا: استخدام الجريد بدل الارتفاع الثابت */
    position:relative;
}

.screen{
    grid-area: 1 / 1; /* التعديل هنا: دمج الشاشات بنفس المساحة بدون Position Absolute */
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    border-radius:30px;
    box-shadow:0 20px 60px rgba(170,70,120,.18);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;

    padding:40px 22px 65px; /* التعديل هنا: مساحة سفلية إضافية للنقاط */

    opacity:0;
    pointer-events:none;
    transform:scale(1.05) translateY(20px);
    filter:blur(8px);

    transition:
        opacity .6s ease,
        transform .7s ease,
        filter .6s ease;
}

.screen.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1) translateY(0);
    filter:blur(0);
}

/* الصورة */
.art{
    width:250px;
    height:250px;
    margin-bottom:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:25px;
}

.art img{
    width:100%;
    height:100%;
    object-fit:cover; /* التعديل هنا: لملء الفراغ داخل الإطار */
    display:block;
}

/* العناوين */
h1{
    font-size:26px;
    line-height:1.6;
    color:#d63384;
    min-height:45px;
    margin-bottom:10px;
    font-weight:800;
}

.screen > p{
    font-size:17px;
    line-height:1.8;
    color:#555;
    min-height:32px;
}

/* مؤشر الكتابة */
.typing-cursor::after{
    content:"|";
    margin-right:3px;
    animation:cursorBlink .55s infinite;
}

@keyframes cursorBlink{
    0%,100%{opacity:1}
    50%{opacity:0}
}

/* الأزرار */
.screen > button{
    border:none;
    outline:none;
    margin-top:25px;
    padding:13px 30px;
    border-radius:50px;
    background:linear-gradient(135deg,#ec4899,#d63384);
    color:white;
    font-family:inherit;
    font-size:17px;
    font-weight:700;
    cursor:pointer;

    opacity:0;
    transform:translateY(15px) scale(.94);

    transition:
        opacity .4s ease,
        transform .4s ease,
        box-shadow .2s ease;
}

.screen > button.show-button{
    opacity:1;
    transform:translateY(0) scale(1);
}

.screen > button:active{
    transform:scale(.93);
}

/* القلب */
.big-heart{
    font-size:100px;
    margin-top:25px;
    cursor:pointer;
    user-select:none;

    opacity:0;
    transform:scale(.5);

    animation:heartAppear .7s .3s forwards,
              heartBeat 1s 1s infinite;
}

@keyframes heartAppear{
    to{
        opacity:1;
        transform:scale(1);
    }
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.13);
    }
}

.big-heart:active{
    transform:scale(.8);
}

/* الرسالة */
.message-card{
    width:100%;
    max-height:350px; /* التعديل هنا: تحديد أقصى ارتفاع بدقة */
    overflow:auto;

    padding:25px 20px;
    border-radius:25px;

    background:rgba(255,255,255,.82);
    box-shadow:0 10px 35px rgba(180,70,130,.15);

    text-align:center;
}

.message-card p{
    font-size:18px;
    line-height:2;
    color:#555;
    white-space:pre-line;
    min-height:30px;
}

/* النقاط */
.dots{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
    z-index:20;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ddd;
    transition:.3s;
}

.dot.active{
    width:22px;
    border-radius:10px;
    background:#d63384;
}

/* القلوب الطائرة */
.floating-heart{
    position:fixed;
    bottom:-30px;
    font-size:20px;
    pointer-events:none;
    animation:floatHeart linear forwards;
    z-index:50;
}

@keyframes floatHeart{
    0%{
        opacity:0;
        transform:translateY(0) scale(.6) rotate(0);
    }

    15%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-100vh) scale(1.3) rotate(25deg);
    }
}

/* للموبايل */
@media(max-width:500px){
    /* تم إزالة الارتفاع الثابت من هنا أيضاً */
    
    .art{
        width:220px;
        height:220px;
    }

    h1{
        font-size:23px;
    }

    .screen > p{
        font-size:16px;
    }
}
</style>
</head>

<body>

<!-- ملف الصوت الخلفي -->
<audio id="bgSong" src="song.mp3" loop></audio>

<div class="app">

<div class="container">

<!-- معرف التليغرام في الركن الفوق داخل الكارت -->

        <span style="direction: ltr;">@IBG6B</span>

</div>

<!-- الشاشة 1 -->
<section class="screen active">

<!-- الشاشة 2 -->

    <h1 data-text="راح اسئلج سؤال صغيروني 🤏"></h1>
    <p data-text=""></p>

    <button onclick="next()">شنو هوه؟</button>

</section>


<!-- الشاشة 3 -->
<section class="screen">

    <div class="art">
        <img src="images/03.jpg" alt="">
    </div>

    <h1 data-text="بس مستحي منج شوي 🥲🤏"></h1>
    <p data-text=""></p>

    <button onclick="next()">اسئل؟🌚</button>

</section>


<!-- الشاشة 4 -->
<section class="screen">

    <div class="art">
        <img src="images/04.jpg" alt="">
    </div>

    <h1 data-text="افاطمه انتِ تحبين علي لو لا؟ 🌚❣️"></h1>
    <p data-text=""></p>

</section>


<!-- الشاشة 5 -->
<section class="screen">

    <div class="art">
        <img src="images/05.jpg" alt="">
    </div>

    <h1 data-text="اذا تحبينه صدك ضغطي ع القلب😉"></h1>

<!-- الشاشة 6 -->
<section class="screen">

    <div class="art">
        <img src="images/06.jpg" alt="">
    </div>

    <div class="message-card">

        <p data-text="فاطمه، شگد أحاول أوصف لج مكانج بقلبي، بس الكلمات ما تكفيني ❣️
أحب وجودج، وأحب ضحكتج، وأتمنى دوم تبقين قريبة مني.
يمكن ما أعرف أگول كلشي بداخلي، بس انتِ احلى صدفه صارت بحياتي ربي لا يحرمني منج 🫂❤️‍🔥"></p>

    </div>

    <button onclick="next()">أحبك 🥲❣️</button>

</section>


<div class="dots" id="dots"></div>

</div>

</div>


<script>

const screens = [...document.querySelectorAll(".screen")];
const dots = document.getElementById("dots");

let current = 0;
let typingRun = 0;

/* تشغيل الأغنية من أول كليك على الصفحة */
const audio = document.getElementById("bgSong");

function playAudio() {
    if (audio) {
        audio.play().catch(() => {});
    }
}

document.addEventListener("click", playAudio, { once: true });
document.addEventListener("touchstart", playAudio, { once: true });


/* إنشاء النقاط */
screens.forEach((screen,index)=>{

    const dot = document.createElement("div");

    dot.className = "dot";

    if(index === 0){
        dot.classList.add("active");
    }

    dot.onclick = ()=>{
        show(index);
    };

    dots.appendChild(dot);

});


/* انتظار */
function wait(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}


/* الكتابة حرف حرف */
function typeText(element,speed,run){

    if(!element){
        return Promise.resolve(true);
    }

    const text = element.dataset.text || "";

    element.textContent = "";
    element.classList.add("typing-cursor");

    return new Promise(resolve=>{

        let i = 0;

        function write(){

            if(run !== typingRun){
                element.textContent = "";
                element.classList.remove("typing-cursor");
                resolve(false);
                return;
            }

            if(i < text.length){

                element.textContent += text.charAt(i);

                i++;

                setTimeout(write,speed);

            }else{

                element.classList.remove("typing-cursor");

                resolve(true);

            }

        }

        write();

    });
}


/* تشغيل كتابة الشاشة */
async function playScreen(screen){

    const run = ++typingRun;

    const title = screen.querySelector("h1[data-text]");
    const normalText = screen.querySelector(":scope > p[data-text]");
    const messageText = screen.querySelector(".message-card p[data-text]");
    const button = screen.querySelector(":scope > button");

    /* إخفاء الزر بالبداية */
    if(button){
        button.classList.remove("show-button");
    }

    /* مسح النصوص قبل البداية */
    if(title){
        title.textContent = "";
    }

    if(normalText){
        normalText.textContent = "";
    }

    if(messageText){
        messageText.textContent = "";
    }

    await wait(450);

    if(run !== typingRun) return;

    /* العنوان */
    if(title && title.dataset.text){

        const ok = await typeText(title,40,run);

        if(!ok) return;

        await wait(120);
    }


    if(run !== typingRun) return;


    /* النص الصغير */
    if(normalText && normalText.dataset.text){

        const ok = await typeText(normalText,28,run);

        if(!ok) return;

        await wait(180);
    }


    if(run !== typingRun) return;


    /* الرسالة الطويلة */
    if(messageText && messageText.dataset.text){

        const ok = await typeText(messageText,25,run);

        if(!ok) return;

        await wait(200);
    }


    if(run !== typingRun) return;


    /* إظهار الزر */
    if(button){

        button.classList.add("show-button");

    }


    /* قلوب */
    createHearts();

}


/* الانتقال */
function show(index){

    if(index < 0){
        index = 0;
    }

    if(index >= screens.length){
        index = screens.length - 1;
    }

    screens[current].classList.remove("active");

    current = index;

    screens[current].classList.add("active");


    [...dots.children].forEach((dot,i)=>{

        dot.classList.toggle(
            "active",
            i === current
        );

    });


    playScreen(screens[current]);

}


/* التالي */
function next(){

    if(current < screens.length - 1){

        show(current + 1);

    }

}


/* السابق */
function previous(){

    if(current > 0){

        show(current - 1);

    }

}


/* إعادة */
function restart(){

    show(0);

}


/* القلوب */
function createHearts(){

    const hearts = ["❤️","💗","💕","❣️","🤍"];

    for(let i=0;i<5;i++){

        const heart = document.createElement("div");

        heart.className = "floating-heart";

        heart.textContent =
            hearts[Math.floor(Math.random()*hearts.length)];

        heart.style.left =
            Math.random()*100 + "vw";

        heart.style.animationDuration =
            (4 + Math.random()*3) + "s";

        heart.style.fontSize =
            (15 + Math.random()*15) + "px";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },7000);

    }

}


/* الأسهم من الكيبورد */
document.addEventListener("keydown",(e)=>{

    if(e.key === "ArrowLeft"){
        next();
    }

    if(e.key === "ArrowRight"){
        previous();
    }

});


/* تشغيل الشاشة الأولى */
playScreen(screens[0]);

</script>

</body>
